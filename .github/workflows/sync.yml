name: Sync Fallout 76 data

on:
  schedule:
    # General refresh every 6 hours
    - cron: "17 */6 * * *"

    # Fallout 76 daily reset, shortly after 12:00 Eastern
    - cron: "17 12 * * *"
      timezone: "America/New_York"

  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/sync.yml"

concurrency:
  group: overseer-sync
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Test
        if: github.event_name == 'push'
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Sync sources
        run: ./target/release/overseer sync --data-dir data

      - name: Commit changed data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ Cargo.lock

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: sync Fallout 76 feeds"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: data

  deploy:
    needs: sync
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
